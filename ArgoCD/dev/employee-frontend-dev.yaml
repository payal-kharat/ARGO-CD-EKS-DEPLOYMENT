
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: employee-frontend-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/payal-kharat/ARGO-CD-EKS-DEPLOYMENT.git
    targetRevision: main
    path: Helm
    helm:
      valueFiles:
        - values-dev.yaml
      parameters:
        - name: components.frontend.enabled
          value: "true"
        - name: components.backend.enabled
          value: "false"
        - name: components.mysql.enabled
          value: "false"
        - name: configMap.enabled
          value: "false"
        - name: secret.enabled
          value: "false"
        - name: ingress.enabled
          value: "true"
        - name: storageClass.enabled
          value: "false"
  destination:
    server: https://E923F740DA49D8181220ECFB2E1EE1D3.gr7.us-east-1.eks.amazonaws.com
    namespace: app-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
